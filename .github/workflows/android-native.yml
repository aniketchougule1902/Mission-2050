name: Native Android APK

on:
  push:
    branches: [main]
    paths:
      - 'game-apk/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission2050-native-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Validate native Godot scene and export installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout current native source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Parse scripts and import procedural project
        run: godot --headless --editor --path game-apk --quit
      - name: Start native scene without a graphics device
        run: godot --headless --path game-apk --quit-after 60
      - name: Export offline ARM64 Android game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/native"
          godot --headless --path game-apk --export-debug "Android" "$GITHUB_WORKSPACE/build/native/Mission2050-debug.apk"
          test -s "$GITHUB_WORKSPACE/build/native/Mission2050-debug.apk"
          file "$GITHUB_WORKSPACE/build/native/Mission2050-debug.apk"
      - name: Upload Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mission2050-native-android-apk
          path: build/native/Mission2050-debug.apk
          retention-days: 30
          if-no-files-found: error
