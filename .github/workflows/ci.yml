name: Mission checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser smoke dependency
        run: npm install --no-save --package-lock=false playwright@1.55.1
      - name: Install headless Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Validate WebGL scene, vehicle traffic and asset loading
        run: node tests/browser-smoke.mjs
      - name: Upload rendered game screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission2050-browser-smoke
          path: game-smoke.png
          retention-days: 7
          if-no-files-found: ignore
