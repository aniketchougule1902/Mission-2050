name: Mission 2050 CI/CD

# main is the reviewed source branch. Vercel is currently connected with
# master as its production branch. After both checks pass, fast-forward
# master to the exact tested main commit; Vercel's Git integration deploys it.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission2050-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run deterministic game tests
        run: npm test
      - name: Build Vercel static output
        run: npm run build
      - name: Check deployable assets
        run: |
          test -s dist/index.html
          test -s dist/src/app.js
          test -s dist/src/city.js
          test -s dist/vendor/three.module.js
          test -s dist/models/Soldier.glb
          test -s dist/models/island_tree_01.glb
          test -s dist/textures/grass_ground_Diffuse.jpg

  browser:
    name: Chromium WebGL smoke and five-level journey
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: verify
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned browser smoke dependency
        run: npm install --no-save --package-lock=false playwright@1.55.1
      - name: Install headless Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify rendered game, movement, asset loading and all five levels
        run: node tests/browser-smoke.mjs
      - name: Upload game screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mission2050-browser-smoke
          path: game-smoke.png
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Deploy verified main through Vercel Git integration
    needs: [verify, browser]
    # Never deploy PRs, manual dispatches, or unchecked master pushes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout exact commit that passed CI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Fast-forward production branch
        env:
          VERIFIED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current_main" != "$VERIFIED_SHA" ]]; then
            echo "::notice::main moved since CI started. Skipping obsolete release."
            exit 0
          fi

          git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master
          current_prod="$(git rev-parse refs/remotes/origin/master)"
          if [[ "$current_prod" == "$VERIFIED_SHA" ]]; then
            echo "Production branch already points at verified commit."
            exit 0
          fi

          if ! git merge-base --is-ancestor "$current_prod" "$VERIFIED_SHA"; then
            echo "::error::Production branch diverged from main. Refusing to overwrite it."
            exit 1
          fi

          git push origin "$VERIFIED_SHA:refs/heads/master"
          echo "Promoted verified commit $VERIFIED_SHA to master."
          echo "Vercel Git integration will build and publish master to production."
